# Archived from about/testimonials.md (the old "Finodex Testimonials and
# Quotations" page). Kept for reuse; not rendered anywhere.
#
#   category – the section the quote sat under on the old page
#   name     – attributed person
#   role     – their role / club / organisation, as given
#   kind     – quote  (a formal testimonial) | email (a forwarded message extract)
#   date     – only where the source gave one
#   text     – the quote, verbatim
#   text_original / lang – original-language text where the quote was translated
#   note     – anything else worth keeping from the source

- category: International
  name: Alexandre Monteiro
  role: ANAV (Portuguese Veterans Athletics Association), chief organiser of EMACNS 2016
  kind: quote
  text: >-
    This solution has great potential and addresses most of the needs of the
    sporting event we are organizing. And when something is not as we would like,
    Andy and his team take care of it extreme lightness and proficiency.
  text_original: >-
    Esta solução tem inúmeras potencialidades e corresponde a grande parte das
    necessidades de um evento desportivo como o que organizamos. No entanto,
    quando há algo que não se encontra como gostaríamos, o Andy e a sua equipa
    encarregam-se de adequar com extrema ligeireza e proficiência.
  lang: pt

- category: Membership and federation management
  name: Peter Kennedy
  role: BMAF IT Manager
  kind: quote
  text: >-
    Reportlab really understand their technology and have followed the principles
    of good system, process and data design in the development of "OpenTrack". It
    has established data repositories of clubs and athletes, which are now being
    used for multiple applications in membership and competition management and
    the design is extendible to other European countries and more applications in
    grassroots athletics of use to national governing bodies, race organisers and
    athletics clubs. Moreover, Reportlab responded very quickly to our request to
    get the first version of the system into operation ready by the beginning of
    the year. The startup was carefully phased and each development tested in a
    separate environment so that we did not have major data hiccups or too many
    urgent fixes to system problems.

- category: Membership and federation management
  name: Dave Beattie
  role: Road Running Secretary, Southern Counties Veterans AC
  kind: email
  date: 2016-04-30
  text: >-
    The feedback I am getting from Southern Counties Veterans members is
    increasingly positive, as pieces of functionality get added to the new BMAF
    membership management and competition entries system. Once a new member has
    entered his or her details, they are remarking how easy it is to enter
    competitions, see which new fixtures are coming up, and check on the entries
    in their chosen event. The only delays revolve around human intervention,
    e.g. waiting for membership secretaries to move them from Pending status to
    Confirmed status, or having their EA registration number checked for
    validity. In short, Reportlab are doing a great job for BMAF and the Area
    Masters Clubs!

- category: End users
  name: Peter Kennedy
  role: BMAF IT Manager
  kind: quote
  text: >-
    Developing an athlete-proof system (a far higher standard than idiot-proof!)
    is the stated aim and even though we are not yet there, many techno-phobes
    and older athletes inexperienced with computers, find the system quick and
    easy for their use, once they have understood the access process, and grasped
    the complexity of masters athletics.

- category: End users
  name: Maggie Statham
  role: Member of Veterans Athletic Club
  kind: quote
  text: >-
    Being a member of OpenTrack has made entering Masters' competitions much
    easier. Seeing what's coming up and getting good information has encouraged me
    to enter events, especially as the online payment system is quick and
    efficient. It's also great to be able to check who else has entered. Paying my
    annual membership subscription through the same account, and being sure that
    my personal details are correct, are other valuable features.

- category: Team Managers
  name: Maggie Statham
  role: Cross country team manager, Veterans Athletic Club (Holland Sports AC Men's and Women's teams, Surrey Cross Country League)
  kind: quote
  text: >-
    As a Team Manager of my club's Men's and Women's teams in the Surrey Cross
    Country leagues, my volunteer job has been made much easier by Reportlab's
    online registration and declaration system. I can do all the data entry from
    my laptop or phone, in advance. I can make changes quickly. No more hanging
    around on race-day wondering whether runners will turn up, then declaring them
    on scruffy paper sheets. The system is open and transparent, the results come
    out sooner and are much more accurate. I think this professional approach
    encourages people to participate and also to volunteer for official roles.

- category: Team Managers
  name: Steve Sandham
  role: Stragglers AC
  kind: quote
  text: >-
    To be able to stand on the XC course yesterday and input additional entrants
    to my previously registered team, using my mobile phone, is fantastic.

- category: Team Managers
  name: Vern
  role: Lingfield AC
  kind: quote
  text: >-
    From the perspective of a team manager of a division 4 club I have been really
    impressed with the new system and think it is very simple to use (but I'm not
    compiling the scores). Hopefully gone are the days of completing declaration
    sheets in the wind and rain on a soggy piece of paper. It's so much easier
    doing the declarations by smart phone... it's a great step forward.

- category: Team Managers
  name: Glenn Mealing
  role: Walton AC
  kind: quote
  text: "I found the new system easy to use....and I'm 69"

- category: Online entries
  name: Club Secretary, Vale of Aylesbury AC
  role: on the T&F Bucks Championships entry system
  kind: email
  date: 2016-04-23
  text: >-
    The online entry system for the T&F bucks champs is great Steve. I've no idea
    who found this site for you to use but thought you might like some positive
    feedback, very quick, very easy and a lot of people at our club are saying the
    same - thumbs up!

- category: National body
  name: Dean Hardman
  role: Head of Business Development and Communications, England Athletics
  kind: email
  date: 2016-02-01
  text: >-
    Andy and Report Lab have an interest in open data and sharing of best
    practice and to that end have been working on a project called OpenTrack,
    which is all about collaborating with each other to improve systems. From an
    EA perspective, we encourage anything that has the potential to make the sport
    better and the lives easier for volunteers... if having a chat helps to
    improve each other's approaches etc. then all the better.
  note: >-
    Dean's "cold call" email to results/entry-system people across the sport,
    opening the standards-process discussion on EA's behalf.
