# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: OpenTrack
name: OpenTrack
tagline: The complete athletics management suite
email: info@opentrack.run
author:
  name: OpenTrack
  twitter: opentrack
description: >- # this means to ignore newlines until "baseurl:"
  OpenTrack is a cloud athletics management platform covering competition
  entries and results, national rankings, and federation administration — one
  open, integrated system for federations, organisers, clubs, and volunteers.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://opentrack.run" # the base hostname & protocol for your site, e.g. http://example.com
date_format: "%b %-d, %Y"

# jekyll-seo-tag: Open Graph, Twitter cards, and Organization/WebSite JSON-LD
twitter:
  username: opentrack
  card: summary_large_image
social:
  name: OpenTrack
  links:
    - https://twitter.com/opentrack
    - https://opentrack.substack.com/
logo: /assets/img/team/logo-square.png
# Analytics: Plausible is loaded in _includes/header.html.
# 
# header_pages: 
#   - product.md
#   - results.md 
#   - team.html
#   - register.md 
 
# Build settings
markdown: kramdown
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-octicons
#  - jekyll-menus

# Webpack handling sass
#sass:
#  load_paths:
#    - _sass
#    - node_modules

# Make sure the `_site/assets/` is not trashed (webpack output)
# keep_files:
#  - dist

collections:
  - team

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - .git/
  - .github/
  - _dev/
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - webpack.config.js
  - webpack.common.js
  - webpack.dev.js
  - webpack.prod.js
  - yarn.lock
  - "*.lock"
  - "*.log"
  # section partials — pulled into their parent page via include_relative,
  # never served on their own (kept out of the build so they don't get indexed)
  - product/competition-management/
  - product/federation-management/
  - product/statistics-rankings/
  - product/league-management/
  - product/virtual-racing/
  - style-guide/

# Keep loose downloads (PDFs etc.) out of the XML sitemap
defaults:
  - scope:
      path: "docs"
    values:
      sitemap: false
  # default social/OG image for pages that don't set their own
  - scope:
      path: ""
    values:
      image: /assets/img/team/logo-square.png
